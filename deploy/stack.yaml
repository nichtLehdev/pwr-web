services:
  posaunenwerk-db:
    image: "postgres:16-alpine"
    description: "PostgreSQL database"
    ports:
      - "5432/tcp"
    envs:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "{{ .Env.POSTGRES_PASSWORD }}"
      POSTGRES_DB: "posaunenwerk"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

  app:
    image: "ghcr.io/nichtlehdev/pwr-web:{{ .Env.RELEASE_VERSION }}"
    description: "Posaunenwerk Next.js app"
    ports:
      - "3000/tcp"
    command:
      - "sh"
      - "-c"
      - >-
        i=0;
        until node node_modules/prisma/build/index.js migrate deploy; do
        i=$((i+1));
        if [ "$i" -ge 30 ]; then echo "Migrations failed after 30 attempts, giving up"; exit 1; fi;
        echo "Database not ready or migration failed, retrying ($i/30) in 5s...";
        sleep 5;
        done;
        node node_modules/tsx/dist/cli.mjs prisma/post-migration-setup.ts || echo "Post-migration setup failed (non-fatal)";
        node node_modules/tsx/dist/cli.mjs prisma/backfill-slugs.ts || echo "Slug backfill failed (non-fatal)";
        node node_modules/tsx/dist/cli.mjs prisma/backfill-phone-format.ts || echo "Phone format backfill failed (non-fatal)";
        node node_modules/tsx/dist/cli.mjs prisma/backfill-description-linebreaks.ts || echo "Description line break backfill failed (non-fatal)";
        exec node node_modules/next/dist/bin/next start
    volumes:
      - "uploads_data:/app/uploads"
    envs:
      DATABASE_URL: "postgresql://postgres:{{ urlquery .Env.POSTGRES_PASSWORD }}@posaunenwerk-db:5432/posaunenwerk"
      NODE_ENV: "production"
      # Öffentliche Seite: blendet u. a. das Beta-Banner aus.
      APP_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      # debug | info | warn | error | silent. "warn" hält das tRPC-Rauschen aus dem Log;
      # für ein Live-Problem auf "debug" setzen.
      LOG_LEVEL: "warn"
      NEXT_PUBLIC_APP_URL: "{{ .Env.APP_URL }}"
      BETTER_AUTH_SECRET: "{{ .Env.BETTER_AUTH_SECRET }}"
      BETTER_AUTH_URL: "{{ .Env.APP_URL }}"
      SMTP_HOST: "{{ .Env.SMTP_HOST }}"
      SMTP_PORT: "{{ .Env.SMTP_PORT }}"
      SMTP_SECURE: "{{ .Env.SMTP_SECURE }}"
      SMTP_USER: "{{ .Env.SMTP_USER }}"
      SMTP_PASSWORD: "{{ .Env.SMTP_PASSWORD }}"
      SMTP_FROM: "{{ .Env.SMTP_FROM }}"
      CRON_SECRET: "{{ .Env.CRON_SECRET }}"
      # Leer = aus (Alltagsschalter im Dashboard). "true" schließt die Seite unabhängig
      # von der Datenbank, auch während einer Migration.
      MAINTENANCE_MODE: "{{ .Env.MAINTENANCE_MODE }}"
      MAINTENANCE_BYPASS_TOKEN: "{{ .Env.MAINTENANCE_BYPASS_TOKEN }}"
      ADMIN_EMAIL: "{{ .Env.ADMIN_EMAIL }}"

volumes:
  postgres_data:
    name: "posaunenwerk_postgres_data"
  uploads_data:
    name: "posaunenwerk_uploads_data"
