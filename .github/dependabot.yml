version: 2
updates:
  # "npm" also covers pnpm.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      trpc:
        patterns:
          - "@trpc/*"
      react-query:
        patterns:
          - "@tanstack/react-query*"
      tiptap:
        patterns:
          - "@tiptap/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-tools:
        patterns:
          - "typescript"
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "prettier-plugin-*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # typescript-eslint throws on TS >= 7 and breaks `pnpm lint`; drop once it supports TS 7.1:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "automated"
