# =============================================================================
# Release & Deploy Workflow
# =============================================================================
# Triggers on published releases (excluding pre-releases)
# Builds Docker image, pushes to GitHub Container Registry, and deploys to server
# =============================================================================

name: Release & Deploy

on:
  release:
    types: [published]

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Hardcode lowercase image name (GitHub doesn't provide lowercase variables)
  IMAGE_NAME: nichtlehdev/pwr-web
  BACKUP_IMAGE_NAME: nichtlehdev/pwr-backup

jobs:
  # ===========================================================================
  # Build and Push Docker Image
  # ===========================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Skip pre-releases
    if: ${{ !github.event.release.prerelease }}

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/posaunenwerk

      - name: Extract metadata for Backup Docker image
        id: meta-backup
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKUP_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Backup Docker image
        id: build-backup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile.backup
          push: true
          tags: ${{ steps.meta-backup.outputs.tags }}
          labels: ${{ steps.meta-backup.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Deploy to Server
  # ===========================================================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
    environment:
      name: production
      url: https://pwr.lehdev.de

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.SERVER_PROJECT_PATH }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: CR_PAT
          script: |
            # Navigate to project directory
            cd ${{ secrets.SERVER_PROJECT_PATH }}

            # Login to GitHub Container Registry
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u nichtlehdev --password-stdin

            # Pull the latest images
            docker pull ghcr.io/nichtlehdev/pwr-web:latest
            docker pull ghcr.io/nichtlehdev/pwr-backup:latest

            # Update the running containers
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Cleanup old images
            docker image prune -f

            echo "✅ Deployment complete!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Wait for container to be healthy
            sleep 10

            # Check if containers are running
            if docker ps | grep -q posaunenwerk-app; then
              echo "✅ App container is running"
            else
              echo "❌ App container is not running"
              docker logs posaunenwerk-app --tail 50
              exit 1
            fi

            if docker ps | grep -q posaunenwerk-backup; then
              echo "✅ Backup container is running"
            else
              echo "❌ Backup container is not running"
              docker logs posaunenwerk-backup --tail 50
              exit 1
            fi