# Runs on every release incl. pre-releases: the old server (env "next") gets all of them,
# mittwald (env "production", values see deploy/stack.yaml) only full releases.

name: Release & Deploy

on:
  release:
    types: [published]

concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Hardcode lowercase image name (GitHub doesn't provide lowercase variables)
  IMAGE_NAME: nichtlehdev/pwr-web
  BACKUP_IMAGE_NAME: nichtlehdev/pwr-backup
  CRON_IMAGE_NAME: nichtlehdev/pwr-cron

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      # Semver without leading "v" (e.g. 1.5.0-rc.1); pins the image tag for the deploys.
      version: ${{ steps.meta.outputs.version }}
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/posaunenwerk

      - name: Extract metadata for Backup Docker image
        id: meta-backup
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKUP_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push Backup Docker image
        id: build-backup
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/Dockerfile.backup
          push: true
          tags: ${{ steps.meta-backup.outputs.tags }}
          labels: ${{ steps.meta-backup.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Cron Docker image
        id: meta-cron
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.CRON_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push Cron Docker image
        id: build-cron
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/Dockerfile.cron
          push: true
          tags: ${{ steps.meta-cron.outputs.tags }}
          labels: ${{ steps.meta-cron.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-next:
    name: Deploy to Old Server (next)
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
    environment:
      name: next
      url: https://pwr.lehdev.de

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.SERVER_PROJECT_PATH }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: CR_PAT
          script: |
            cd ${{ secrets.SERVER_PROJECT_PATH }}

            # Pre-releases are never tagged "latest", so pin the exact version.
            export APP_IMAGE_TAG=${{ needs.build-and-push.outputs.version }}

            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u nichtlehdev --password-stdin

            docker pull ghcr.io/nichtlehdev/pwr-web:$APP_IMAGE_TAG
            docker pull ghcr.io/nichtlehdev/pwr-backup:$APP_IMAGE_TAG
            docker pull ghcr.io/nichtlehdev/pwr-cron:$APP_IMAGE_TAG

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Every pre-release leaves three tagged images behind. Remove only our own old tags
            # ("latest" stays as fallback without APP_IMAGE_TAG); `prune -af` would hit other images.
            echo "Disk before cleanup:"
            docker system df --format 'table {{.Type}}\t{{.Size}}\t{{.Reclaimable}}' || true

            for repo in pwr-web pwr-backup pwr-cron; do
              docker images --format '{{.Repository}}:{{.Tag}}' \
                "ghcr.io/nichtlehdev/$repo" 2>/dev/null \
                | grep -v ":${APP_IMAGE_TAG}$" \
                | grep -v ':latest$' \
                | grep -v ':<none>$' \
                | xargs -r docker rmi 2>/dev/null || true
            done

            docker image prune -f

            echo "Disk after cleanup:"
            docker system df --format 'table {{.Type}}\t{{.Size}}\t{{.Reclaimable}}' || true

            echo "✅ Deployment complete!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Wait for container to be healthy
            sleep 10

            if docker ps | grep -q posaunenwerk-app; then
              echo "✅ App container is running"
            else
              echo "❌ App container is not running"
              docker logs posaunenwerk-app --tail 50
              exit 1
            fi

            if docker ps | grep -q posaunenwerk-backup; then
              echo "✅ Backup container is running"
            else
              echo "❌ Backup container is not running"
              docker logs posaunenwerk-backup --tail 50
              exit 1
            fi

            if docker ps | grep -q posaunenwerk-registration-closed-cron; then
              echo "✅ Registration-closed cron container is running"
            else
              echo "❌ Registration-closed cron container is not running"
              docker logs posaunenwerk-registration-closed-cron --tail 50
              exit 1
            fi

  deploy-production:
    name: Deploy to mittwald (production)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ !github.event.release.prerelease }}

    permissions:
      contents: read
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy stack to mittwald
        uses: mittwald/deploy-container-action@v1
        env:
          # Every {{ .Env.* }} placeholder in deploy/stack.yaml must be defined here.
          RELEASE_VERSION: ${{ needs.build-and-push.outputs.version }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_URL: ${{ vars.APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          # Alle drei dürfen leer bleiben: APP_URL ist ohnehin vertraut, und ohne
          # gesetzte Header nimmt better-auth die eigene Voreinstellung. Eine nicht
          # angelegte Variable ergibt hier den leeren String.
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ vars.BETTER_AUTH_TRUSTED_ORIGINS }}
          BETTER_AUTH_IP_HEADERS: ${{ vars.BETTER_AUTH_IP_HEADERS }}
          BETTER_AUTH_TRUSTED_PROXIES: ${{ vars.BETTER_AUTH_TRUSTED_PROXIES }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          # Wartungsmodus: leer lassen, solange die Seite offen sein soll.
          # Der Alltagsschalter sitzt im Dashboard und braucht kein Deployment.
          MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE }}
          MAINTENANCE_BYPASS_TOKEN: ${{ secrets.MAINTENANCE_BYPASS_TOKEN }}
        with:
          api_token: ${{ secrets.MITTWALD_API_TOKEN }}
          stack_id: ${{ vars.MITTWALD_STACK_ID }}
          stack_file: ${{ github.workspace }}/deploy/stack.yaml
          skip_recreation: "posaunenwerk-db"

      - name: Verify deployment
        if: ${{ vars.APP_URL != '' }}
        run: |
          echo "Waiting for ${{ vars.APP_URL }} to respond..."
          sleep 30
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null "${{ vars.APP_URL }}"; then
              echo "✅ App is responding"
              exit 0
            fi
            sleep 10
          done
          echo "❌ App did not respond in time"
          exit 1
