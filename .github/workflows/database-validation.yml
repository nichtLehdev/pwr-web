name: CI - Database Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "prisma/**"
      - "prisma.config.ts"
  push:
    branches: [main, develop]
    paths:
      - "prisma/**"
      - "prisma.config.ts"

jobs:
  prisma-validate:
    name: Validate Prisma Schema
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Ohne `version` liest die Action `packageManager` aus package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Validate Prisma schema
        run: pnpm prisma validate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

  # `prisma validate` prüft nicht, ob die Migrationen auf leerer Datenbank laufen;
  # scheitern sie beim Deploy auf mittwald, startet die App nicht.
  migrate-deploy:
    name: Migrations & Drift
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: posaunenwerk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/posaunenwerk_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Alle Migrationen auf leerer Datenbank, wie beim ersten Start auf neuem Server.
      - name: Apply all migrations from scratch
        run: pnpm prisma migrate deploy

      # Fängt eine vergessene Migration zu einer schema.prisma-Änderung ab;
      # --exit-code liefert 2 bei Unterschied.
      - name: Check for schema drift
        run: >-
          pnpm prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

      # Beim Deploy sind beide Skripte "non-fatal"; hier sollen Fehler auffallen.
      - name: Run post-migration setup
        run: pnpm tsx prisma/post-migration-setup.ts

      - name: Run slug backfill
        run: pnpm tsx prisma/backfill-slugs.ts

      # Die Deploy-Skripte laufen bei *jedem* Start, müssen also wiederholbar sein.
      - name: Re-run setup and backfill (idempotency)
        run: |
          pnpm tsx prisma/post-migration-setup.ts
          pnpm tsx prisma/backfill-slugs.ts
