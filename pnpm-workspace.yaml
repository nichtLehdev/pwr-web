allowBuilds:
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'

# Force patched versions of transitive dependencies with known vulnerabilities
overrides:
  'hono@<4.12.25': '>=4.12.25'
  'fast-uri@<3.1.5': '>=3.1.5'
  'sharp@<0.35.0': '>=0.35.0'
  # Stay on undici 7.x: jsdom requires undici's internal lib/handler layout,
  # which was reorganized in v8. 7.29.0 is the patched version.
  'undici@>=7.0.0 <7.29.0': '~7.29.0'
  'ws@<8.19.1': '>=8.19.1'
  'postcss@<8.5.18': '>=8.5.18'
  # Keep the ProseMirror core single-instance: its packages do instanceof checks
  # on each other, so a second copy breaks the editor (e.g. Enter).
  'prosemirror-model': '^1.25.11'
  'prosemirror-view': '^1.42.2'

  # Vulnerable transitive deps with no reachable parent bump (Dependabot can't fix them).
  'js-yaml@<3.15.2': '~3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '~4.3.2'
  'dompurify@<3.4.13': '^3.4.13'
  'fflate@<0.8.3': '^0.8.3'
  'mysql2@<3.24.0': '^3.24.0'
