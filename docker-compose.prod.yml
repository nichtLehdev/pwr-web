# =============================================================================
# Posaunenwerk Docker Compose - Production (uses pre-built image)
# =============================================================================
#
# This file is for production deployment using pre-built images from GHCR.
# For local development, use docker-compose.yml instead.
#
# Quick Start:
#   1. Copy .env.example to .env and configure values
#   2. Set CRON_SECRET (and SMTP_*) in .env
#   3. Run: docker compose -f docker-compose.prod.yml up -d
#
# APP_IMAGE_TAG pins the image version (default: latest). The release
# workflow sets it to the exact release version so pre-releases deploy too.
#
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  posaunenwerk-db:
    image: postgres:16-alpine
    container_name: posaunenwerk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-posaunenwerk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-posaunenwerk}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # Database Migration (runs once on startup)
  # ===========================================================================
  db-migrate:
    image: ghcr.io/nichtlehdev/pwr-web:${APP_IMAGE_TAG:-latest}
    container_name: posaunenwerk-migrate
    depends_on:
      posaunenwerk-db:
        condition: service_healthy
    networks:
      - internal
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@posaunenwerk-db:5432/${POSTGRES_DB:-posaunenwerk}
      NODE_ENV: production
    # Invoke prisma directly (not via pnpm) to avoid pnpm 11's
    # runDepsStatusCheck which tries to reinstall node_modules at startup.
    command:
      ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"

  # ===========================================================================
  # Post-Migration Setup (run once after permission migrations)
  # ===========================================================================
  post-migration-setup:
    image: ghcr.io/nichtlehdev/pwr-web:${APP_IMAGE_TAG:-latest}
    container_name: posaunenwerk-post-migration-setup
    profiles:
      - post-migration
    depends_on:
      posaunenwerk-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - internal
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@posaunenwerk-db:5432/${POSTGRES_DB:-posaunenwerk}
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    command:
      ["node", "node_modules/tsx/dist/cli.mjs", "prisma/post-migration-setup.ts"]
    restart: "no"

  # ===========================================================================
  # Database Seeding (optional, run manually)
  # ===========================================================================
  db-seed:
    image: ghcr.io/nichtlehdev/pwr-web:${APP_IMAGE_TAG:-latest}
    container_name: posaunenwerk-seed
    profiles:
      - seed
    depends_on:
      posaunenwerk-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - internal
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@posaunenwerk-db:5432/${POSTGRES_DB:-posaunenwerk}
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_GITHUB_CLIENT_ID: ${BETTER_AUTH_GITHUB_CLIENT_ID:-}
      BETTER_AUTH_GITHUB_CLIENT_SECRET: ${BETTER_AUTH_GITHUB_CLIENT_SECRET:-}
      SKIP_ENV_VALIDATION: 1
    command: ["node", "node_modules/tsx/dist/cli.mjs", "prisma/seed.ts"]
    restart: "no"

  # ===========================================================================
  # Database Backup Service (scheduled backups)
  # ===========================================================================
  db-backup:
    image: ghcr.io/nichtlehdev/pwr-backup:${APP_IMAGE_TAG:-latest}
    container_name: posaunenwerk-backup
    restart: unless-stopped
    init: true
    depends_on:
      posaunenwerk-db:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - backup_data:/backups
    environment:
      POSTGRES_HOST: posaunenwerk-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-posaunenwerk}
      BACKUP_DIR: /backups
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *} # Default: 2 AM daily
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30} # Keep backups for 30 days

  # ===========================================================================
  # Next.js Application
  # ===========================================================================
  app:
    image: ghcr.io/nichtlehdev/pwr-web:${APP_IMAGE_TAG:-latest}
    container_name: posaunenwerk-app
    restart: unless-stopped
    depends_on:
      posaunenwerk-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - Aliases
    expose:
      - "3000"
    volumes:
      # Mounted outside public/ so file access always goes through the
      # authorizing /api/uploads route (public/ would be served directly).
      - uploads_data:/app/uploads
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@posaunenwerk-db:5432/${POSTGRES_DB:-posaunenwerk}

      # Application
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1

      # Public URLs
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_GITHUB_CLIENT_ID: ${BETTER_AUTH_GITHUB_CLIENT_ID:-}
      BETTER_AUTH_GITHUB_CLIENT_SECRET: ${BETTER_AUTH_GITHUB_CLIENT_SECRET:-}

      # Github Settings
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # SMTP Configuration for Mailcow
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

      # Cron API (manual triggering of /api/cron/* routes)
      CRON_SECRET: ${CRON_SECRET:-}

      # In-app schedule for registration-closed overview e-mails
      # (scheduled via instrumentation.ts, no sidecar container)
      REGISTRATION_CLOSED_CRON_SCHEDULE: ${REGISTRATION_CLOSED_CRON_SCHEDULE:-0 */6 * * *}

networks:
  internal:
    driver: bridge
  Aliases:
    external: true

volumes:
  postgres_data:
    name: posaunenwerk_postgres_data
  uploads_data:
    name: posaunenwerk_uploads_data
  backup_data:
    name: posaunenwerk_backup_data
